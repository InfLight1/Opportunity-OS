<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opportunity OS Viewer</title>
<style>
  :root {
    --bg:#ececea; --bar:#fbfbfa; --ink:#1c1c1b; --muted:#6d6d69; --line:#d9d9d4;
    --chip:#f1f1ee; --chip-on:#1c1c1b; --chip-on-ink:#fbfbfa; --star:#c98a12;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#141413; --bar:#1d1d1c; --ink:#ececea; --muted:#9a9a95; --line:#30302e;
      --chip:#262625; --chip-on:#ececea; --chip-on-ink:#1d1d1c; --star:#e6a92b;
    }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; display:flex; flex-direction:column; overflow:hidden; }
  button, select, input { font:inherit; color:inherit; }
  button { cursor:pointer; }

  /* Top bar */
  .bar { background:var(--bar); border-bottom:1px solid var(--line); padding:10px 14px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .title { display:flex; align-items:center; gap:10px; min-width:240px; }
  .title strong { font-size:16px; }
  .title span { color:var(--muted); }
  .counter { color:var(--muted); font-variant-numeric:tabular-nums; }
  .group { display:flex; gap:4px; background:var(--chip); border:1px solid var(--line); border-radius:8px; padding:3px; }
  .group button { border:0; background:transparent; padding:5px 10px; border-radius:6px; }
  .group button[aria-pressed="true"] { background:var(--chip-on); color:var(--chip-on-ink); }
  .icon { border:1px solid var(--line); background:var(--chip); border-radius:8px; padding:5px 11px; }
  .icon:hover, .group button:hover:not([aria-pressed="true"]) { background:var(--line); }
  .star { font-size:18px; line-height:1; padding:4px 10px; }
  .star[aria-pressed="true"] { color:var(--star); }
  .note { flex:1; min-width:200px; border:1px solid var(--line); background:var(--bg); border-radius:8px; padding:6px 10px; }
  .spacer { flex:1; }

  /* Strip of versions */
  .strip { background:var(--bar); border-bottom:1px solid var(--line); display:flex; gap:6px; padding:8px 14px; overflow-x:auto; }
  .strip button { flex:none; border:1px solid var(--line); background:var(--chip); border-radius:999px; padding:4px 12px; white-space:nowrap; }
  .strip button.on { background:var(--chip-on); color:var(--chip-on-ink); border-color:var(--chip-on); }
  .strip button.b { outline:2px dashed var(--muted); outline-offset:1px; }
  .strip .fav::before { content:"★ "; color:var(--star); }
  .strip .k { color:var(--muted); margin-right:4px; font-variant-numeric:tabular-nums; }
  .strip button.on .k { color:inherit; opacity:.7; }

  /* Stage */
  .stage { flex:1; display:flex; gap:12px; padding:12px; min-height:0; }
  .pane { flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; }
  .pane-label { font-size:12px; color:var(--muted); padding:0 2px 6px; display:flex; justify-content:space-between; }
  .pane-label a { color:var(--muted); }
  .viewport { flex:1; position:relative; overflow:hidden; background:#fff; border:1px solid var(--line); border-radius:8px; margin:0 auto; width:100%; }
  .viewport.phone { width:375px; flex:none; height:min(812px, 100%); border-radius:22px; border-width:6px; border-color:var(--ink); }
  .viewport iframe { position:absolute; top:0; left:0; border:0; transform-origin:0 0; }
  .ref { position:absolute; right:22px; bottom:22px; width:280px; border-radius:8px; border:1px solid var(--line); box-shadow:0 8px 30px rgba(0,0,0,.25); display:none; z-index:5; }
  .ref.show { display:block; }
  .help { color:var(--muted); font-size:12px; padding:0 14px 8px; background:var(--bar); }
  dialog { border:1px solid var(--line); border-radius:12px; background:var(--bar); color:var(--ink); max-width:560px; width:90vw; }
  dialog textarea { width:100%; height:220px; border:1px solid var(--line); border-radius:8px; background:var(--bg); padding:10px; font:13px/1.5 ui-monospace, monospace; }
  @media (max-width:760px) { .stage { padding:6px; } .note { order:9; flex-basis:100%; } }
</style>
</head>
<body>
<div class="bar">
  <div class="title"><strong id="name"></strong><span id="skill"></span><span class="counter" id="count"></span></div>
  <button class="icon" id="prev" title="Previous (←)">←</button>
  <button class="icon" id="next" title="Next (→)">→</button>
  <div class="group" role="group" aria-label="Device">
    <button id="dDesk" aria-pressed="true" title="Desktop (D)">Desktop</button>
    <button id="dPhone" aria-pressed="false" title="Phone (P)">Phone</button>
  </div>
  <div class="group" role="group" aria-label="Layout">
    <button id="mOne" aria-pressed="true" title="One at a time">One</button>
    <button id="mTwo" aria-pressed="false" title="Side by side (C)">Side by side</button>
  </div>
  <button class="icon" id="sync" aria-pressed="false" title="Scroll both together (S)">Sync scroll: off</button>
  <button class="icon" id="refBtn" aria-pressed="false" title="Show reference screenshot (R)">Reference</button>
  <button class="icon star" id="star" aria-pressed="false" title="Favorite (F)">☆</button>
  <input class="note" id="note" placeholder="What do you like or dislike about this one?">
  <button class="icon" id="copy">Copy my picks</button>
  <button class="icon" id="grid" title="All 10 as a grid">Grid</button>
</div>
<div class="strip" id="strip"></div>
<div class="help" id="help">← → or 1-9, 0 to switch · Side by side: click a chip for the left, Shift+click for the right · F favorite · R reference</div>
<div class="stage" id="stage"></div>

<dialog id="dlg">
  <p><strong>Your picks</strong>. Paste this into Claude.</p>
  <textarea id="out" readonly></textarea>
  <p style="display:flex;gap:8px;justify-content:flex-end"><button class="icon" id="copyNow">Copy</button><button class="icon" id="close">Close</button></p>
</dialog>

<script>
/* EDIT PER PROJECT: one row per version. path is relative to this file. */
const VERSIONS = [
  /* [slug, style name, skill, reference image path (or "")] */
  ["night-route-v2b-images", "Night Route", "v2b · with images", "../references/BeamsSection.webp"],
  ["night-route-v2b", "Night Route", "v2b · Clear planner (no images)", "../references/BeamsSection.webp"],
  ["mix-night-unfair", "Mix: Night Route x Unfair Advantage", "NR layout · UA colors", "../references/BeamsSection.webp"],
  ["night-route-v2a", "Night Route", "v2a · On the route", "../references/BeamsSection.webp"],
  ["unfair-advantage-v2a", "Unfair Advantage", "v2a · Scattered tunnel", "../references/MedTechLandingPage.png"],
  ["unfair-advantage-v2b", "Unfair Advantage", "v2b · Deadline line", "../references/MedTechLandingPage.png"],
  ["night-route-impeccable", "Night Route", "impeccable", "../references/BeamsSection.webp"],
  ["night-route-taste", "Night Route", "taste", "../references/BeamsSection.webp"],
  ["unfair-advantage-impeccable", "Unfair Advantage", "impeccable", "../references/MedTechLandingPage.png"],
  ["unfair-advantage-taste", "Unfair Advantage", "taste", "../references/MedTechLandingPage.png"],
  ["greater-care-impeccable", "Greater Care", "impeccable", "../references/EarthDayPage.webp"],
  ["greater-care-taste", "Greater Care", "taste", "../references/EarthDayPage.webp"],
  ["quiet-lake-impeccable", "Quiet Lake", "impeccable", "../references/MentalHealthSection.webp"],
  ["quiet-lake-taste", "Quiet Lake", "taste", "../references/MentalHealthSection.webp"],
  ["cobalt-horizon-impeccable", "Cobalt Horizon", "impeccable", "../references/AILandingPage.webp"],
  ["cobalt-horizon-taste", "Cobalt Horizon", "taste", "../references/AILandingPage.webp"],
];
const PROJECT = "opportunity-os";
/* Optional: section headings that appear in every version, top to bottom (used by Sync scroll). */
const SYNC_MARKS = ["Too many opportunities", "Most of them", "One project. Several doors", "Now plan your weeks", "Your plan", "Opportunities", "Your weeks", "What if you had", "One project, several doors", "Add your own"];
/* ----------------------------------------------------------------------- */

const KEY = "viewer:" + PROJECT;
let state = { i:0, b:1, device:"desk", two:false, sync:false, ref:false, fav:{}, notes:{} };
try { Object.assign(state, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };
const $ = id => document.getElementById(id);
const url = v => `${v[0]}/index.html`;
const label = v => `${v[1]} · ${v[2]}`;
const n = VERSIONS.length;
state.i = Math.min(state.i, n - 1); state.b = Math.min(state.b, n - 1);

function strip() {
  $("strip").innerHTML = "";
  VERSIONS.forEach((v, k) => {
    const b = document.createElement("button");
    b.innerHTML = `<span class="k">${(k + 1) % 10}</span>${label(v)}`;
    if (k === state.i) b.classList.add("on");
    if (state.two && k === state.b) b.classList.add("b");
    if (state.fav[v[0]]) b.classList.add("fav");
    b.onclick = e => { if (state.two && e.shiftKey) state.b = k; else state.i = k; render(); };
    $("strip").appendChild(b);
  });
  $("strip").querySelector(".on")?.scrollIntoView({ block:"nearest", inline:"nearest" });
}

function pane(k, side) {
  const v = VERSIONS[k];
  const p = document.createElement("div"); p.className = "pane";
  p.innerHTML = `<div class="pane-label"><span>${side ? side + ": " : ""}${label(v)}</span><a href="${url(v)}" target="_blank">Open full ↗</a></div>`;
  const vp = document.createElement("div"); vp.className = "viewport" + (state.device === "phone" ? " phone" : "");
  const f = document.createElement("iframe"); f.src = url(v); f.title = label(v);
  vp.appendChild(f);
  if (v[3]) { const im = document.createElement("img"); im.className = "ref" + (state.ref ? " show" : ""); im.src = v[3]; im.alt = v[1] + " reference"; vp.appendChild(im); }
  p.appendChild(vp);
  return p;
}

/* Desktop always renders at 1440px wide and scales to fit, so side by side still shows the desktop layout. */
function fit() {
  document.querySelectorAll(".viewport").forEach(vp => {
    const f = vp.querySelector("iframe");
    const w = state.device === "phone" ? 375 : 1440;
    const s = Math.min(1, vp.clientWidth / w);
    f.style.width = w + "px"; f.style.height = (vp.clientHeight / s) + "px";
    f.style.transform = `scale(${s})`;
  });
}

/* Sync scroll. The side you touch (wheel, drag, key) leads; the other follows.
   With SYNC_MARKS it lines up the same section on both sides (pages differ in length);
   without them it falls back to the same fraction of the page. */
const frames = [];
let leader = 0, syncing = false;

function scrollerOf(doc) { return doc.scrollingElement || doc.documentElement; }

function findMarks(doc) {
  const norm = t => t.replace(/\s+/g, " ").trim().toLowerCase();
  const all = [...doc.body.querySelectorAll("*")].filter(e => !["SCRIPT", "STYLE", "SVG", "svg"].includes(e.tagName));
  const out = {}; let after = -1;
  for (const m of SYNC_MARKS) {
    const want = norm(m);
    const hit = all.find(e => {
      const t = norm(e.textContent || "");
      if (!t.startsWith(want) || t.length > want.length + 80) return false;
      if ([...e.children].some(c => norm(c.textContent || "").startsWith(want))) return false;
      const r = e.getBoundingClientRect();
      return r.height > 0 && r.top + scrollerOf(doc).scrollTop > after;
    });
    if (hit) { out[m] = hit; after = hit.getBoundingClientRect().top + scrollerOf(doc).scrollTop; }
  }
  return out;
}

function points(fr) {
  const se = scrollerOf(fr.doc), top = se.scrollTop;
  const max = Math.max(1, se.scrollHeight - se.clientHeight);
  const pts = { start: 0, end: max };
  for (const [m, el] of Object.entries(fr.marks)) pts[m] = Math.min(max, Math.max(0, el.getBoundingClientRect().top + top - 80));
  return pts;
}

function follow() {
  if (!state.sync || frames.length < 2) return;
  const a = frames[leader], b = frames[1 - leader];
  if (!a?.doc || !b?.doc) return;
  const pa = points(a), pb = points(b);
  const keys = ["start", ...SYNC_MARKS.filter(m => m in pa && m in pb), "end"];
  const xa = keys.map(k => pa[k]), xb = keys.map(k => pb[k]);
  const t = scrollerOf(a.doc).scrollTop;
  let k = 0; while (k < xa.length - 2 && t >= xa[k + 1]) k++;
  const span = Math.max(1, xa[k + 1] - xa[k]);
  const y = xb[k] + (Math.min(Math.max(t - xa[k], 0), span) / span) * (xb[k + 1] - xb[k]);
  syncing = true;
  scrollerOf(b.doc).scrollTop = y;
  requestAnimationFrame(() => { syncing = false; });
}

function hookSync() {
  frames.length = 0;
  document.querySelectorAll(".viewport iframe").forEach((f, idx) => {
    f.addEventListener("load", () => {
      let doc; try { doc = f.contentDocument; } catch { return; }
      if (!doc) return;
      const fr = { doc, marks: {} }; frames[idx] = fr;
      /* Smooth scrolling makes the follower animate and fight back, so turn it off inside the frames. */
      const st = doc.createElement("style"); st.textContent = "html,body{scroll-behavior:auto!important}"; doc.head.appendChild(st);
      setTimeout(() => { try { fr.marks = findMarks(doc); } catch {} }, 600);
      const lead = () => { leader = idx; };
      ["wheel", "pointerdown", "touchstart", "keydown"].forEach(ev => doc.addEventListener(ev, lead, { passive: true, capture: true }));
      doc.addEventListener("scroll", () => { if (!syncing && leader === idx) requestAnimationFrame(follow); }, { passive: true, capture: true });
    });
  });
}

function render() {
  const v = VERSIONS[state.i];
  $("name").textContent = v[1]; $("skill").textContent = v[2];
  $("count").textContent = `${state.i + 1} / ${n}`;
  $("dDesk").setAttribute("aria-pressed", state.device === "desk");
  $("dPhone").setAttribute("aria-pressed", state.device === "phone");
  $("mOne").setAttribute("aria-pressed", !state.two);
  $("mTwo").setAttribute("aria-pressed", state.two);
  $("sync").style.display = state.two ? "" : "none";
  $("sync").textContent = "Sync scroll: " + (state.sync ? "on" : "off");
  $("sync").setAttribute("aria-pressed", state.sync);
  $("refBtn").setAttribute("aria-pressed", state.ref);
  $("star").textContent = state.fav[v[0]] ? "★" : "☆";
  $("star").setAttribute("aria-pressed", !!state.fav[v[0]]);
  $("note").value = state.notes[v[0]] || "";
  $("note").placeholder = state.two ? `Note on the left one (${v[1]} · ${v[2]})` : "What do you like or dislike about this one?";
  const st = $("stage"); st.innerHTML = "";
  st.appendChild(pane(state.i, state.two ? "Left" : ""));
  if (state.two) st.appendChild(pane(state.b, "Right"));
  strip(); fit(); hookSync(); save();
}

const go = d => { state.i = (state.i + d + n) % n; render(); };
$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("dDesk").onclick = () => { state.device = "desk"; render(); };
$("dPhone").onclick = () => { state.device = "phone"; render(); };
$("mOne").onclick = () => { state.two = false; render(); };
$("mTwo").onclick = () => { state.two = true; if (state.b === state.i) state.b = (state.i + 1) % n; render(); };
$("sync").onclick = () => {
  state.sync = !state.sync;
  $("sync").textContent = "Sync scroll: " + (state.sync ? "on" : "off");
  $("sync").setAttribute("aria-pressed", state.sync);
  save(); follow();
};
$("refBtn").onclick = () => { state.ref = !state.ref; document.querySelectorAll(".ref").forEach(r => r.classList.toggle("show", state.ref)); $("refBtn").setAttribute("aria-pressed", state.ref); save(); };
$("star").onclick = () => { const s = VERSIONS[state.i][0]; state.fav[s] = !state.fav[s]; render(); };
$("note").oninput = e => { state.notes[VERSIONS[state.i][0]] = e.target.value; save(); };
$("grid").onclick = () => location.href = "index.html";
$("copy").onclick = () => {
  const lines = VERSIONS.filter(v => state.fav[v[0]] || state.notes[v[0]])
    .map(v => `${state.fav[v[0]] ? "★ " : "- "}${label(v)}${state.notes[v[0]] ? ": " + state.notes[v[0]] : ""}`);
  $("out").value = lines.length ? "My picks from the version viewer:\n" + lines.join("\n") : "No favorites or notes yet. Press ☆ or type a note first.";
  $("dlg").showModal();
};
$("copyNow").onclick = async () => { try { await navigator.clipboard.writeText($("out").value); $("copyNow").textContent = "Copied"; } catch { $("out").select(); document.execCommand("copy"); } };
$("close").onclick = () => { $("dlg").close(); $("copyNow").textContent = "Copy"; };

addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (/^Digit[0-9]$/.test(e.code)) { const k = (+e.code.slice(5) + 9) % 10; if (k < n) { if (state.two && e.shiftKey) state.b = k; else state.i = k; render(); } }
  else if (e.key === "f") $("star").click();
  else if (e.key === "r") $("refBtn").click();
  else if (e.key === "d") $("dDesk").click();
  else if (e.key === "p") $("dPhone").click();
  else if (e.key === "c") (state.two ? $("mOne") : $("mTwo")).click();
  else if (e.key === "s" && state.two) $("sync").click();
});
addEventListener("resize", fit);
render();
</script>
</body>
</html>
